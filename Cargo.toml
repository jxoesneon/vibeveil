[package]
name = "vibeveil"
version = "0.1.0"
edition = "2024"
authors = ["Jose Eduardo Rojas Jimenez <joseeduardox@gmail.com>"]
description = "Universal music-driven dynamic wallpaper & semantic desktop theming engine in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jxoesneon/vibeveil"
homepage = "https://github.com/jxoesneon/vibeveil"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
zbus = { version = "5.19", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
dirs = "6.0"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
palette = { version = "0.7", features = ["std"] }
regex = "1.11"
sha2 = "0.10"
indicatif = "0.17"
futures-util = "0.3.34"
tokio-util = "0.7.19"
clap_complete = "4.5"

[dev-dependencies]
tempfile = "3"
