name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build and Publish Release Artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build Release Binary
        run: cargo build --release --locked

      - name: Prepare Release Bundle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          DIST_DIR="vibeveil-${VERSION}-x86_64-unknown-linux-gnu"
          mkdir -p "${DIST_DIR}/completions"

          cp target/release/vibeveil "${DIST_DIR}/"
          strip "${DIST_DIR}/vibeveil"

          # Shell completions
          "${DIST_DIR}/vibeveil" completions bash > "${DIST_DIR}/completions/vibeveil.bash"
          "${DIST_DIR}/vibeveil" completions zsh > "${DIST_DIR}/completions/_vibeveil"
          "${DIST_DIR}/vibeveil" completions fish > "${DIST_DIR}/completions/vibeveil.fish"

          # Service and docs
          cp packaging/systemd/vibeveil.service "${DIST_DIR}/"
          cp README.md "${DIST_DIR}/"
          cp LICENSE-MIT "${DIST_DIR}/"
          cp LICENSE-APACHE "${DIST_DIR}/"

          tar -czvf "${DIST_DIR}.tar.gz" "${DIST_DIR}"
          sha256sum "${DIST_DIR}.tar.gz" > "${DIST_DIR}.tar.gz.sha256"

          echo "ARCHIVE=${DIST_DIR}.tar.gz" >> $GITHUB_ENV
          echo "CHECKSUM=${DIST_DIR}.tar.gz.sha256" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          generate_release_notes: true

  publish-crates:
    name: Publish to Crates.io
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Publish to Crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret is not configured in repository settings. Skipping crates.io publish."
            exit 0
          fi
          echo "Publishing to crates.io..."
          cargo publish --token "$CARGO_REGISTRY_TOKEN"

  publish-aur:
    name: Publish to Arch User Repository (AUR)
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_KEY" ]; then
            echo "AUR_SSH_PRIVATE_KEY secret is not configured in repository settings. Skipping AUR deployment."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$AUR_KEY" > ~/.ssh/aur_rsa
          chmod 600 ~/.ssh/aur_rsa
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_rsa -o StrictHostKeyChecking=accept-new"
          git clone ssh://aur@aur.archlinux.org/vibeveil.git aur-repo || {
            mkdir -p aur-repo
            cd aur-repo
            git init
            git remote add origin ssh://aur@aur.archlinux.org/vibeveil.git
            cd ..
          }

          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --staged --quiet; then
            echo "No changes to commit for AUR."
          else
            git commit -m "Update to ${{ github.ref_name }}"
            git push origin master
          fi
